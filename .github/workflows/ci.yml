name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    name: deps (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Set Composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$GITHUB_WORKSPACE/.composer-cache" >> "$GITHUB_ENV"

      - name: Restore Composer cache
        uses: actions/cache@v6
        with:
          path: |
            .composer-cache
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v7
        with:
          name: vendor-php-${{ matrix.php }}
          path: vendor
          retention-days: 7

  lint_php:
    name: lint:php (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs:
      - deps
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download vendor artifact
        uses: actions/download-artifact@v8
        with:
          name: vendor-php-${{ matrix.php }}
          path: vendor

      - name: "laravel-pint"
        uses: aglipanci/laravel-pint-action@2.6
        with:
          preset: laravel

  analyse_phpstan:
    name: analyse:phpstan (PHP 8.5)
    runs-on: ubuntu-latest
    needs:
      - deps
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v8
        with:
          name: vendor-php-8.5
          path: vendor

      - name: Run PHPStan
        run: composer analyse

  test_phpunit:
    name: test:phpunit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs:
      - deps
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: ${{ matrix.php == '8.5' && 'pcov' || 'none' }}

      - name: Download vendor artifact
        uses: actions/download-artifact@v8
        with:
          name: vendor-php-${{ matrix.php }}
          path: vendor

      - name: Run PHPUnit with JUnit output
        if: matrix.php != '8.5'
        run: |
          mkdir -p bootstrap/cache
          php ./vendor/bin/phpunit --log-junit junit.xml

      - name: Run PHPUnit with coverage
        if: matrix.php == '8.5'
        run: |
          mkdir -p bootstrap/cache
          php ./vendor/bin/phpunit --log-junit junit.xml --coverage-clover coverage.xml --coverage-text

      - name: Enforce coverage threshold
        if: matrix.php == '8.5'
        env:
          COVERAGE_THRESHOLD: '80'
        run: |
          set -euo pipefail
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            if ($xml === false) {
              fwrite(STDERR, "Unable to read coverage.xml\n");
              exit(1);
            }
            $lineRate = (float) ($xml["line-rate"] ?? 0);
            $coverage = round($lineRate * 100, 2);
            $threshold = (float) getenv("COVERAGE_THRESHOLD");
            fwrite(STDOUT, "Coverage: {$coverage}% (threshold: {$threshold}%)\n");
            if ($coverage < $threshold) {
              fwrite(STDERR, "Coverage threshold not met.\n");
              exit(1);
            }
          '

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-php-${{ matrix.php }}
          path: |
            junit.xml
            coverage.xml
            storage/logs
          if-no-files-found: ignore
          retention-days: 7

  all-checks-passed:
    name: CI / All checks passed
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - deps
      - lint_php
      - analyse_phpstan
      - test_phpunit
    if: always()
    steps:
      - name: Check all jobs passed
        shell: bash
        run: |
          set -euo pipefail

          results=(
            "deps=${{ needs.deps.result }}"
            "lint_php=${{ needs.lint_php.result }}"
            "analyse_phpstan=${{ needs.analyse_phpstan.result }}"
            "test_phpunit=${{ needs.test_phpunit.result }}"
          )

          failed=false
          for entry in "${results[@]}"; do
            job="${entry%%=*}"
            result="${entry##*=}"
            echo "${job}: ${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done

          if [[ "${failed}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi

          echo "All jobs passed or were skipped."

