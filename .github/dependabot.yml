version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
    groups:
      actions-official:
        patterns:
          - actions/*
      actions-php:
        patterns:
          - shivammathur/*
          - aglipanci/*
      actions-file-detection:
        patterns:
          - tj-actions/*
          - step-security/*
      actions-markdown:
        patterns:
          - DavidAnson/*
          - tcort/*
          - stefanzweifel/*
      actions-release:
        patterns:
          - actions/github-script
          - softprops/*

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels:
      - dependencies
      - php
    commit-message:
      prefix: build
    open-pull-requests-limit: 10
    groups:
      laravel-runtime:
        patterns:
          - illuminate/*
          - laravel/*
          - orchestra/*
          - nunomaduro/*
      testing-and-analysis:
        patterns:
          - phpunit/*
          - phpstan/*
          - larastan/*
      support-libraries:
        patterns:
          - guzzlehttp/*
          - psr/*