image: lorisleiva/laravel-docker:8.4

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

stages:
  - prepare
  - quality
  - release

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "0"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

.cache_php_push: &cache_php_push
  key:
    files:
      - composer.lock
    prefix: php-8.4
  paths:
    - vendor/
    - .composer-cache/
  policy: pull-push

.cache_php_pull: &cache_php_pull
  key:
    files:
      - composer.lock
    prefix: php-8.4
  paths:
    - vendor/
    - .composer-cache/
  policy: pull

deps:php:
  stage: prepare
  cache:
    - *cache_php_push
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
  artifacts:
    expire_in: 1 week
    paths:
      - vendor/

lint:php:
  stage: quality
  needs:
    - job: deps:php
      artifacts: true
  cache:
    - *cache_php_pull
  script:
    - ./vendor/bin/pint --test

lint:commits:
  stage: quality
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        FROM_REF="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        FROM_REF="$CI_COMMIT_BEFORE_SHA"
      fi

      if [ -z "$FROM_REF" ] || [ "$FROM_REF" = "0000000000000000000000000000000000000000" ]; then
        FROM_REF=$(git rev-list --max-parents=0 HEAD | tail -n1)
      fi

      if [ -z "$FROM_REF" ]; then
        echo "Unable to determine commit range for linting."
        exit 1
      fi

      COMMITS=$(git rev-list --no-merges "$FROM_REF..$CI_COMMIT_SHA")

      if [ -z "$COMMITS" ]; then
        COMMITS="$CI_COMMIT_SHA"
      fi

      for commit_sha in $COMMITS; do
        header=$(git show -s --format=%s "$commit_sha")
        ./scripts/validate-conventional-commit.sh "$header"
      done

test:pest:
  stage: quality
  needs:
    - job: deps:php
      artifacts: true
  cache:
    - *cache_php_pull
  before_script:
    - echo 'memory_limit = 1024M' >> /usr/local/etc/php/conf.d/docker-php-memory-limit.ini
  script:
    - ./vendor/bin/pest --log-junit junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
    paths:
      - junit.xml
      - storage/logs/

mr:auto-merge:
  stage: release
  image: curlimages/curl:8.8.0
  allow_failure: true
  needs:
    - job: lint:php
    - job: lint:commits
    - job: test:pest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      if [ -z "$CI_BOT_TOKEN" ]; then
        echo "CI_BOT_TOKEN not configured, skipping auto-merge."
        exit 0
      fi
      curl --silent --show-error --fail \
        --request PUT \
        --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
        --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/merge" \
        --data "merge_when_pipeline_succeeds=true" \
        --data "should_remove_source_branch=true" \
        --data "squash=true"

release:create:
  stage: release
  image: alpine:3.20
  needs:
    - job: lint:php
    - job: lint:commits
    - job: test:pest
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      set -eu
      if [ "${RELEASE_DEBUG:-1}" = "1" ]; then
        set -x
      fi

      echo "[release:create] shell=$(readlink /proc/$$/exe 2>/dev/null || echo /bin/sh)"
      echo "[release:create] commit=$CI_COMMIT_SHA pipeline=$CI_PIPELINE_ID"
      : > release.env

      echo "[release:create] step=validate-token"
      if [ -z "$CI_BOT_TOKEN" ]; then
        echo "CI_BOT_TOKEN is required for release creation."
        exit 1
      fi

      echo "[release:create] step=resolve-last-tag"
      LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
      if [ -z "$LAST_TAG" ]; then
        LAST_TAG="v0.0.0"
        RANGE="HEAD"
      else
        RANGE="$LAST_TAG..HEAD"
      fi
      echo "[release:create] last_tag=$LAST_TAG range=$RANGE"

      echo "[release:create] step=calculate-bump"
      if git log --format=%B "$RANGE" | grep -q "BREAKING CHANGE" || git log --format=%s "$RANGE" | grep -Eq '^[a-z]+\(.+\)!:|^[a-z]+!:'; then
        BUMP="major"
      elif git log --format=%s "$RANGE" | grep -Eq '^feat(\(.+\))?:'; then
        BUMP="minor"
      else
        BUMP="patch"
      fi
      echo "[release:create] bump=$BUMP"

      VERSION_NO_V=${LAST_TAG#v}
      MAJOR=${VERSION_NO_V%%.*}
      REST=${VERSION_NO_V#*.}
      MINOR=${REST%%.*}
      PATCH=${REST#*.}

      if ! echo "$MAJOR" | grep -Eq '^[0-9]+$' || ! echo "$MINOR" | grep -Eq '^[0-9]+$' || ! echo "$PATCH" | grep -Eq '^[0-9]+$'; then
        echo "Invalid semver tag parsed from LAST_TAG=$LAST_TAG"
        exit 1
      fi

      case "$BUMP" in
        major)
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
          ;;
        minor)
          MINOR=$((MINOR + 1))
          PATCH=0
          ;;
        *)
          PATCH=$((PATCH + 1))
          ;;
      esac

      NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
      echo "[release:create] new_tag=$NEW_TAG"

      echo "[release:create] step=generate-changelog"
      {
        echo "# ${NEW_TAG}"
        echo
        echo "Generated from ${RANGE}."
        echo
        git log "$RANGE" --pretty=format:'- %s (%h)'
      } > CHANGELOG.md
      wc -l CHANGELOG.md

      echo "[release:create] step=check-create-tag"
      TAG_EXISTS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
        --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/$NEW_TAG")
      echo "[release:create] tag_exists_http=$TAG_EXISTS"

      if [ "$TAG_EXISTS" = "404" ]; then
        curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
          --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags" \
          --data-urlencode "tag_name=$NEW_TAG" \
          --data-urlencode "ref=$CI_COMMIT_SHA" \
          --data-urlencode "message=Release $NEW_TAG"
      else
        echo "Tag ${NEW_TAG} already exists, continuing."
      fi

      echo "[release:create] step=check-create-release"
      RELEASE_EXISTS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
        --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$NEW_TAG")
      echo "[release:create] release_exists_http=$RELEASE_EXISTS"

      if [ "$RELEASE_EXISTS" = "404" ]; then
        curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
          --header "Content-Type: application/x-www-form-urlencoded" \
          --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
          --data-urlencode "name=$NEW_TAG" \
          --data-urlencode "tag_name=$NEW_TAG" \
          --data-urlencode "description@CHANGELOG.md"
      else
        curl --silent --show-error --fail \
          --request PUT \
          --header "PRIVATE-TOKEN: $CI_BOT_TOKEN" \
          --header "Content-Type: application/x-www-form-urlencoded" \
          --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$NEW_TAG" \
          --data-urlencode "name=$NEW_TAG" \
          --data-urlencode "description@CHANGELOG.md"
      fi

      {
        echo "RELEASE_TAG=$NEW_TAG"
      } > release.env
      echo "[release:create] wrote release.env"
  artifacts:
    expire_in: 4 weeks
    paths:
      - CHANGELOG.md
      - release.env
    reports:
      dotenv: release.env

